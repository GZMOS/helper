name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Build on the oldest supported distro so the binary's glibc symbol
          # floor stays low enough to run on it. Ubuntu 22.04 ships glibc 2.35;
          # building on a newer image (e.g. ubuntu-latest → 24.04 / glibc 2.39)
          # produces a binary that aborts on 22.04 with `GLIBC_2.39 not found`.
          - runner: ubuntu-22.04
            suffix: x86_64
          - runner: ubuntu-22.04-arm
            suffix: aarch64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable
      - run: cargo build --release
      - name: Assert glibc symbol floor (must run on Ubuntu 22.04)
        run: |
          max=$(objdump -T target/release/wispr-flow-linux-helper \
            | grep -oP 'GLIBC_\d+\.\d+' | sort -uV | tail -1)
          echo "Highest required glibc symbol: ${max:-none}"
          if [ "$(printf '%s\nGLIBC_2.35\n' "$max" | sort -V | tail -1)" != "GLIBC_2.35" ]; then
            echo "::error::Binary requires $max (> GLIBC_2.35); it will not run on Ubuntu 22.04."
            exit 1
          fi
      - name: Rename binary for upload
        run: |
          cp target/release/wispr-flow-linux-helper \
            wispr-flow-linux-helper-${{ matrix.suffix }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wispr-flow-linux-helper-${{ matrix.suffix }}
          path: wispr-flow-linux-helper-${{ matrix.suffix }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wispr-flow-linux-helper-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wispr-flow-linux-helper-aarch64
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            wispr-flow-linux-helper-x86_64
            wispr-flow-linux-helper-aarch64
          body: |
            Clean-room Wispr Flow Linux helper binaries (Unlicense / public domain).

            Prebuilt for x86_64 and aarch64; consumed by the
            wispr-flow-linux package build.
